<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Postbird 信鸽的安全边界</title>
  <desc id="desc">Postbird 负责发前确认、只读收件和本地处理，不提供删除邮件的工具。</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="34" font-weight="600" fill="#003F88">信鸽只跑腿，不替你做主</text>
  <text x="600" y="108" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" fill="#64748B">四条写进工具里的边界，改提示词也绕不过去</text>
  <circle cx="600" cy="365" r="150" fill="#E6F1FB" stroke="#003F88" stroke-width="4"/>
  <path d="M520 390 C536 337 578 313 625 326 C596 339 578 361 573 397 C553 382 538 382 520 390 Z" fill="#003F88"/>
  <path d="M550 354 L441 245 L520 272 L586 333 Z" fill="#6B8CBE"/>
  <path d="M550 365 L442 329 L520 317 L594 344 Z" fill="#8AA6C9"/>
  <path d="M622 330 C644 301 680 300 700 321 C678 320 667 330 663 347 L704 355 L663 371 C658 398 647 421 622 440 Z" fill="#003F88"/>
  <rect x="699" y="342" width="84" height="58" rx="6" fill="#ffffff" stroke="#003F88" stroke-width="4"/>
  <path d="M702 346 L741 373 L780 346" fill="none" stroke="#003F88" stroke-width="4" stroke-linejoin="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect x="80" y="180" width="280" height="132" rx="22" fill="#EAF3DE" stroke="#97C459" stroke-width="2"/>
    <circle cx="130" cy="230" r="24" fill="#3B6D11"/>
    <path d="M118 230 L127 239 L144 220" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="174" y="226" font-size="25" font-weight="600" fill="#27500A">发信前确认</text>
    <text x="174" y="259" font-size="17" fill="#3B6D11">预览 + confirm:true</text>
    <text x="104" y="291" font-size="16" fill="#52634A">没有你点头，一封都发不出去</text>
    <rect x="840" y="180" width="280" height="132" rx="22" fill="#EAF3DE" stroke="#97C459" stroke-width="2"/>
    <circle cx="890" cy="230" r="24" fill="#3B6D11"/>
    <path d="M878 230 L887 239 L904 220" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="934" y="226" font-size="25" font-weight="600" fill="#27500A">收件严格只读</text>
    <text x="934" y="259" font-size="17" fill="#3B6D11">PEEK，不置已读</text>
    <text x="864" y="291" font-size="16" fill="#52634A">不改旗标，不移动，不删除</text>
    <rect x="80" y="430" width="280" height="132" rx="22" fill="#FCEBEB" stroke="#F09595" stroke-width="2"/>
    <circle cx="130" cy="480" r="24" fill="#A32D2D"/>
    <path d="M119 469 L141 491 M141 469 L119 491" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="174" y="476" font-size="25" font-weight="600" fill="#791F1F">不提供删除</text>
    <text x="174" y="509" font-size="17" fill="#A32D2D">工具层根本没有入口</text>
    <text x="104" y="541" font-size="16" fill="#765454">模型想删也没有工具可调用</text>
    <rect x="840" y="430" width="280" height="132" rx="22" fill="#E6F1FB" stroke="#85B7EB" stroke-width="2"/>
    <circle cx="890" cy="480" r="24" fill="#185FA5"/>
    <path d="M880 481 L880 470 C880 457 900 457 900 470 L900 481 M875 481 H905 V500 H875 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <text x="934" y="476" font-size="25" font-weight="600" fill="#0C447C">数据留在本地</text>
    <text x="934" y="509" font-size="17" fill="#185FA5">索引、附件、台账</text>
    <text x="864" y="541" font-size="16" fill="#52677A">不经过 Postbird 的云端服务器</text>
  </g>
  <path d="M360 248 C430 248 455 287 478 314" fill="none" stroke="#8AA6C9" stroke-width="3"/>
  <path d="M840 248 C770 248 745 287 722 314" fill="none" stroke="#8AA6C9" stroke-width="3"/>
  <path d="M360 496 C430 496 455 448 478 421" fill="none" stroke="#8AA6C9" stroke-width="3"/>
  <path d="M840 496 C770 496 745 448 722 421" fill="none" stroke="#8AA6C9" stroke-width="3"/>
  <text x="600" y="645" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" fill="#64748B">Postbird 信鸽 · 开源、可审计、默认克制</text>
</svg>
